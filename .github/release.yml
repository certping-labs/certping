# Categories for GitHub's generated release notes (used by the Release workflow).
# Only GitHub's default labels are used.
changelog:
  exclude:
    authors: [dependabot]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
