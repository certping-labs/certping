# Weekly dependency updates. Minor and patch bumps are grouped per ecosystem so
# each app gets at most one routine PR a week; major bumps arrive separately.
# A 7-day cooldown waits a week after a release before proposing it, so a bad
# or malicious release is usually caught before it reaches this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: npm # pnpm lockfiles are supported under the npm ecosystem
    directory: /apps/web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    # Major versions are upgraded by hand, with testing; Dependabot alerts still report every
    # vulnerable dependency, including ones whose fix needs a major version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(web)" }

  - package-ecosystem: maven
    directory: /apps/server
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      server-minor-patch:
        update-types: [minor, patch]
    # Major versions are upgraded by hand, with testing; Dependabot alerts still report every
    # vulnerable dependency, including ones whose fix needs a major version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(server)" }

  - package-ecosystem: maven
    directory: /apps/agent
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      agent-minor-patch:
        update-types: [minor, patch]
    # Major versions are upgraded by hand, with testing; Dependabot alerts still report every
    # vulnerable dependency, including ones whose fix needs a major version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(agent)" }

  - package-ecosystem: maven
    directory: /apps/notifier
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      notifier-minor-patch:
        update-types: [minor, patch]
    # Major versions are upgraded by hand, with testing; Dependabot alerts still report every
    # vulnerable dependency, including ones whose fix needs a major version.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(notifier)" }

  - package-ecosystem: docker
    directories: [/apps/web, /apps/server, /apps/agent, /apps/notifier, /deploy/all-in-one]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images:
        patterns: ["*"]
    commit-message: { prefix: "chore(docker)" }

  # Caddy, PostgreSQL, Valkey, BusyBox and Mailpit in the Compose kit, pinned by tag and digest.
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      compose-images:
        patterns: ["*"]
    # A PostgreSQL major version needs a data upgrade, so it is never bumped automatically.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(deploy)" }

  # Image references in the Helm charts' values.yaml (PostgreSQL and Valkey).
  - package-ecosystem: helm
    directories: [/deploy/charts/certping, /deploy/charts/certping-agent]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      chart-images:
        patterns: ["*"]
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore(deploy)" }
