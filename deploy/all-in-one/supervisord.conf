; CertPing all-in-one process tree. supervisord runs as root and starts each service as its own
; user. Each program sources only its own /run/certping/<service>.env (0600, owned by that user),
; written by the entrypoint from config.env with just the values the service needs. Web and Caddy
; start from an empty environment (env -i), so nothing given to the container reaches them.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:postgres]
; max_connections is set, not left to initdb's autotuning: the server pool (40) plus the notifier's (10)
; plus the agent and admin sessions need well under 100.
command=/usr/lib/postgresql/current/bin/postgres -D /var/lib/certping/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/var/run/postgresql -c max_connections=100
user=postgres
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:valkey]
; Valkey, the Redis-compatible store the server uses (REDIS_HOST below). Bind address, data
; directory and the password are in valkey.conf (readable by valkey only).
command=/usr/bin/valkey-server /run/certping/valkey.conf
user=valkey
priority=10
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:server]
command=/bin/bash -c 'set -a; . /run/certping/server.env; set +a; exec java -Xmx${CERTPING_SERVER_HEAP} -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -jar /opt/certping/server.jar'
user=certping
directory=/var/lib/certping
priority=20
autorestart=true
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_PROFILES_ACTIVE="selfhosted",OTEL_JAVAAGENT_ENABLED="false",DB_URL="jdbc:postgresql://127.0.0.1:5432/certping",DB_POOL_SIZE="40",REDIS_HOST="127.0.0.1",CERTPING_LOCAL_SECRET_DIR="/var/lib/certping/secrets",NOTIFICATION_SERVICE_BASE_URL="http://127.0.0.1:8082",STATUS_AGENT_BASE_URL="http://127.0.0.1:8081",INTERNAL_GRPC_BIND_ADDRESS="127.0.0.1"

; The notifier and the agent wait for the server (it runs the schema migrations), like depends_on
; in the Compose kit; supervisord still restarts them if they ever exit. The wait is quiet (curl -fs)
; and logs one "waiting for the server" line every 30 seconds (10 tries, 3 seconds apart).
[program:notifier]
command=/bin/bash -c 'set -a; . /run/certping/notifier.env; set +a; n=0; until curl -fs -o /dev/null http://127.0.0.1:8080/actuator/health/readiness; do if [ "$n" -le 0 ]; then echo "notifier: waiting for the server"; n=10; fi; n=$((n - 1)); sleep 3; done; exec java -Xmx${CERTPING_NOTIFIER_HEAP} -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -jar /opt/certping/notifier.jar'
user=certping-notifier
directory=/tmp
priority=30
autorestart=true
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_PROFILES_ACTIVE="selfhosted",OTEL_JAVAAGENT_ENABLED="false",SERVER_PORT="8082",DB_URL="jdbc:postgresql://127.0.0.1:5432/certping",CERTPING_INTERNAL_URL="http://127.0.0.1:8080",CERT_MANAGER_GRPC_ADDR="127.0.0.1:50051"

[program:agent]
command=/bin/bash -c 'set -a; . /run/certping/agent.env; set +a; export CERTPING_AGENT_TOKEN="$CERTPING_BOOTSTRAP_AGENT_TOKEN"; n=0; until curl -fs -o /dev/null http://127.0.0.1:8080/actuator/health/readiness; do if [ "$n" -le 0 ]; then echo "agent: waiting for the server"; n=10; fi; n=$((n - 1)); sleep 3; done; exec java -Xmx${CERTPING_AGENT_HEAP} -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom -jar /opt/certping/agent.jar'
user=certping
directory=/var/lib/certping
priority=30
autorestart=true
startsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SPRING_PROFILES_ACTIVE="selfhosted",OTEL_JAVAAGENT_ENABLED="false",SERVER_PORT="8081",CERTPING_SERVER_URL="http://127.0.0.1:8080",CERTPING_AGENT_BUNDLED="true",AGENT_SECRET_STORE_PROVIDER="LOCAL",CERTPING_LOCAL_SECRET_DIR="/var/lib/certping/secrets"

[program:web]
command=/bin/bash -c '. /run/certping/web.env; exec /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/var/cache/certping-web NODE_ENV=production PORT=3000 HOSTNAME=0.0.0.0 NEXT_TELEMETRY_DISABLED=1 MALLOC_ARENA_MAX=2 CERTPING_URL="$CERTPING_URL" /usr/local/bin/node /opt/certping/web/server.js'
user=certping-web
directory=/opt/certping/web
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:caddy]
command=/bin/bash -c '. /run/certping/caddy.env; exec /usr/bin/env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/var/lib/certping/caddy XDG_DATA_HOME=/var/lib/certping/caddy XDG_CONFIG_HOME=/var/lib/certping/caddy CERTPING_SITE_ADDRESS="$CERTPING_SITE_ADDRESS" /usr/local/bin/caddy run --config /etc/certping/Caddyfile --adapter caddyfile'
user=certping-caddy
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
