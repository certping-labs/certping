# The whole application, as a deployment boots it, minus the outside world (FullApplicationContextTest).
# Each value below stands in for an environment variable the deployment kit injects. External
# endpoints point at addresses nothing listens on: their clients are built at startup, as on a
# pod, and nothing the test asserts needs them to answer. Postgres and Redis are real
# (Testcontainers, set by each test class), so Flyway migrates every version, as on a pod.

# src/test/resources/application.properties turns Flyway off for the slice tests; a pod runs it.
spring.flyway.enabled=true

# Plain HTTP clients, never called during the test.
notification-service.base-url=http://127.0.0.1:9
public-status.agent-base-url=http://127.0.0.1:9

app.base-url=http://localhost:8080
app.dashboard-base-url=http://localhost:3000/dashboard
app.frontend-base-url=http://localhost:3000
app.frontend.redirect-url=http://localhost:3000/auth/callback
app.frontend.allowed-origins=http://localhost:3000
cors.allowed-origins=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.expose-headers=Authorization,X-Request-Id
cors.allow-credentials=true
cors.max-age=3600

jwt.issuer=http://localhost:8080
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.password-reset-secret=context-test-password-reset-secret

# 32 zero bytes, base64: PepperedPasswordEncoder refuses to start without an active pepper.
app.auth.password-pepper.active-version=v1
app.auth.password-pepper.keys.v1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Port 0: the internal gRPC server binds a free port, so the test never collides with a local stack.
certping.internal-grpc.port=0
# The context tests check the outage path at once, without the startup grace.
public-status.startup-grace=PT0S
