# Test-only overrides. Coexists with src/main/resources/application.yaml — Spring Boot
# loads both because the file names differ. Keys set here win on conflict.
#
# Production leaves these blank when the env vars are unset and refuses to start.
# Tests that boot the application supply placeholders here. Not real credentials.
#
# Disable Flyway in tests: the production migration (V1__baseline.sql)
# uses PostgreSQL-specific types (TIMESTAMPTZ, JSONB) and constructs (partial unique
# indexes, JSON operators in CHECK constraints) that the in-memory H2 used by
# @DataJpaTest cannot parse. The repository tests in src/test/java/.../repository/
# build their own minimal schemas via JdbcTemplate in @BeforeEach, so they don't
# need Flyway at all.
spring.flyway.enabled=false
