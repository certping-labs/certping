packages:
  - "."

# Install a newly published version only once it is 3 days old (default 1),
# and refuse a version whose publish trust is weaker than an earlier one's.
minimumReleaseAge: 4320
trustPolicy: no-downgrade
# Published by their usual maintainers without the provenance earlier versions
# carried (checked 2026-11-27); exact versions only, so a newer one is checked.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - solid-js@1.9.20
  - undici-types@6.21.0

allowBuilds:
  # Ships prebuilt binaries; its install script only rebuilds them, so it is not run.
  "@parcel/watcher": false
  "@swc/core": true
  core-js: true
  msw: true
  sharp: true
  unrs-resolver: true

peerDependencyRules:
  ignoreMissing:
    - "@playwright/test"
  allowedVersions:
    "@types/react": "19"
    date-fns: "4"
    react: "19"
    react-dom: "19"
    tailwindcss: "4"

overrides:
  playwright: ^1.61.1
  "@playwright/test": ^1.61.1
  "@babel/core": ^7.29.1
  browserslist: ^4.29.5
  follow-redirects: ^1.16.2
  nanoid@^3.0.0: ^3.3.20
  source-map-js: ^1.2.2
  ajv: 6.14.0
  brace-expansion@^1.1.0: 1.1.13
  brace-expansion@^5.0.0: 5.0.6
  flatted: 3.4.2
  form-data: 4.0.6
  js-yaml@<4.0.0: 3.15.0
  js-yaml@>=4.0.0: 4.3.0
  lodash: 4.18.0
  minimatch@^3.0.0: 3.1.4
  minimatch@^9.0.0: 9.0.7
  picomatch@^2.3.0: 2.3.2
  picomatch@^4.0.0: 4.0.4
  postcss: 8.5.32
  uuid: 14.0.0
  ws: 8.21.0
  yaml@^2.0.0: 2.8.3
